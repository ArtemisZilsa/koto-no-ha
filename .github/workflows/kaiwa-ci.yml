name: Kaiwa CI

# Gerbang otomatis untuk perubahan di my-app/: build (termasuk typecheck),
# lint, dan validator konten kaiwa (npm run validate:kaiwa). Dipakai sebagai
# bukti "gerbang lulus" sebelum PR teknis di-auto-merge (lihat
# scheduler/kaiwa-30d/STATE.md) — validator sendiri tidak pernah menulis ke
# Supabase, hanya membaca migrasi di repo.

on:
  pull_request:
    paths:
      - 'my-app/**'
      - '.github/workflows/kaiwa-ci.yml'
  push:
    branches: [master]
    paths:
      - 'my-app/**'
      - '.github/workflows/kaiwa-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # validate:kaiwa membandingkan diff terhadap origin/master

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - run: npm ci

      - run: npm run lint

      # `next/font/google` (Inter, Noto Sans/Serif JP) mengunduh berkas font dari
      # Google saat build — tidak ada cache di runner CI, jadi satu hiccup jaringan
      # menggagalkan seluruh build (lihat run #6 di master, 23 Sep 2026: gagal
      # dengan "Module not found" berulang di noto_sans_jp_*.module.css, sukses
      # lagi di commit berikutnya tanpa perubahan kode). Ulangi sampai 3x sebelum
      # dianggap gagal sungguhan.
      - name: npm run build (retry saat fetch font Google Fonts gagal sementara)
        run: |
          for attempt in 1 2 3; do
            if npm run build; then
              exit 0
            fi
            echo "Build gagal (percobaan $attempt/3). Menunggu 10 detik lalu mengulang..."
            sleep 10
          done
          echo "Build tetap gagal setelah 3 percobaan."
          exit 1

      - run: npm run validate:kaiwa -- --base=origin/master
